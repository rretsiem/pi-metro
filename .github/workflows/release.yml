name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: publish to npm (Trusted Publishing / OIDC)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create (push tag → GH Release)
      id-token: write   # required for npm Trusted Publishing (OIDC handshake)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Trusted Publishing (OIDC) requires npm >= 11.5.0. The Node 22
      # image ships with npm 10.x; install a recent npm explicitly.
      - name: Install npm 11+
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      # No --token, no .npmrc, no NODE_AUTH_TOKEN. npm reads the OIDC
      # token from the workflow environment when registry auth is missing
      # AND the repo is configured as a Trusted Publisher on npmjs.com.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Stable versions (no '-') land on 'latest'; pre-release
          # versions (e.g. 0.2.2-rc.0) land on 'next' because npm refuses
          # to publish pre-releases to 'latest' without an explicit tag.
          if [[ "$VERSION" == *-* ]]; then
            TAG="next"
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION to '$TAG'"
          npm publish --access public --tag "$TAG"

      # Mirror the npm publish as a GitHub Release so the Releases page
      # stays in sync with the registry. Tagged-push only; workflow_dispatch
      # has no tag to release from.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Creating GitHub Release for $TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes