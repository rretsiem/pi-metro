name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: publish to npm (Trusted Publishing / OIDC)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create (push tag → GH Release)
      id-token: write   # required for npm Trusted Publishing (OIDC handshake)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Trusted Publishing (OIDC) requires npm >= 11.5.0. The Node 22
      # image ships with npm 10.x; install a recent npm explicitly.
      - name: Install npm 11+
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      # No --token, no .npmrc, no NODE_AUTH_TOKEN. npm reads the OIDC
      # token from the workflow environment when registry auth is missing
      # AND the repo is configured as a Trusted Publisher on npmjs.com.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Stable versions (no '-') land on 'latest'; pre-release
          # versions (e.g. 0.2.2-rc.0) land on 'next' because npm refuses
          # to publish pre-releases to 'latest' without an explicit tag.
          if [[ "$VERSION" == *-* ]]; then
            TAG="next"
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION to '$TAG'"
          npm publish --access public --tag "$TAG"

      # Mirror the npm publish as a GitHub Release so the Releases page
      # stays in sync with the registry. Tagged-push only; workflow_dispatch
      # has no tag to release from. Notes come from the matching section of
      # CHANGELOG.md (so the prose you curate in one place shows up on
      # GitHub *and* in the npm tarball — same source of truth). Falls back
      # to `--generate-notes` (auto commit list) if a section is missing.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$(mktemp)"
          # Slice the matching `## VERSION` block out of CHANGELOG.md
          # (stops at the next `## ` header so it doesn't leak the older
          # section). Strip leading "## " and the trailing " - DATE"
          # before the version comparison so pre-release suffixes like
          # `0.2.3-rc.0` match exactly.
          awk -v v="$VERSION" '
            BEGIN { p = 0 }
            /^## / {
              if (p) exit
              line = $0
              sub(/^## /, "", line)
              sub(/ .*/, "", line)
              if (line == v) p = 1
            }
            p
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ -s "$NOTES_FILE" ]; then
            echo "Using curated notes from CHANGELOG.md for $VERSION"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE"
          else
            echo "::warning::No CHANGELOG entry for $VERSION; falling back to --generate-notes"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi