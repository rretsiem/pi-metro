name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: publish to npm (Trusted Publishing / OIDC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm Trusted Publishing (OIDC handshake)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted Publishing (OIDC) requires npm >= 11.5.0. The Node 22
      # image ships with npm 10.x; install a recent npm explicitly.
      - name: Install npm 11+
        run: npm install -g npm@latest
      - name: Debug OIDC env
        run: |
          echo "npm version: $(npm --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+set}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-UNSET}"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:-UNSET}"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      # No --token, no .npmrc, no NODE_AUTH_TOKEN. npm reads the OIDC
      # token from the workflow environment when registry auth is missing
      # AND the repo is configured as a Trusted Publisher on npmjs.com.
      - name: Publish to npm
        run: npm publish --access public